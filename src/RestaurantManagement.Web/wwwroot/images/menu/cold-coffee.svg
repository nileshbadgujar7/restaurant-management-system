<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)" rx="16"/>
  <!-- Coaster -->
  <ellipse cx="160" cy="195" rx="65" ry="20" fill="#d6d3d1" filter="url(#shadow)"/>
  <!-- Tall Mason / Frappe Glass -->
  <path d="M 125 75 L 132 190 C 132 195, 188 195, 188 190 L 195 75 Z" fill="#ffffff" fill-opacity="0.3" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <!-- Coffee Liquid -->
  <path d="M 126 95 L 133 188 C 133 192, 187 192, 187 188 L 194 95 Z" fill="url(#coffee)"/>
  <!-- Ice Cream Scoop on Top -->
  <circle cx="160" cy="72" r="26" fill="#fffbeb" filter="url(#shadow)"/>
  <circle cx="150" cy="65" r="16" fill="#fef3c7"/>
  <!-- Whipped Swirl / Chocolate Drizzle -->
  <path d="M 142 62 Q 155 75 168 58 Q 175 72 182 66" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
  <path d="M 136 100 Q 150 120 145 145" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Choco Sprinkles -->
  <rect x="146" y="55" width="4" height="2" rx="1" fill="#451a03"/>
  <rect x="165" y="52" width="4" height="2" rx="1" fill="#451a03"/>
  <rect x="158" y="66" width="4" height="2" rx="1" fill="#451a03"/>
  <!-- Straw -->
  <line x1="175" y1="170" x2="195" y2="40" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
  <!-- Title Badge -->
  <rect x="75" y="15" width="170" height="28" rx="14" fill="#78350f" opacity="0.95"/>
  <text x="160" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">COLD COFFEE</text>
</svg>

