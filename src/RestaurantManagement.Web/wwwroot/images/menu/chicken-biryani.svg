<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="handi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="chicken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)" rx="16"/>
  <!-- Handi / Bowl -->
  <ellipse cx="160" cy="155" rx="125" ry="60" fill="url(#handi)" filter="url(#shadow)"/>
  <!-- Biryani Rice Mound -->
  <ellipse cx="160" cy="140" rx="110" ry="50" fill="#fef08a"/>
  <!-- Spiced Saffron Streaks -->
  <ellipse cx="130" cy="135" rx="25" ry="12" fill="#fbbf24" opacity="0.9"/>
  <ellipse cx="190" cy="145" rx="30" ry="14" fill="#f97316" opacity="0.85"/>
  <ellipse cx="150" cy="150" rx="40" ry="16" fill="#fef08a"/>
  <!-- Rice Grains Texture -->
  <line x1="100" y1="130" x2="108" y2="132" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="145" x2="128" y2="147" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="130" x2="173" y2="128" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="205" y1="135" x2="213" y2="137" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Roasted Chicken Drumstick -->
  <path d="M 125 110 C 135 95, 175 100, 185 115 C 190 125, 175 135, 155 135 C 135 135, 115 125, 125 110 Z" fill="url(#chicken)" filter="url(#shadow)"/>
  <path d="M 180 115 L 215 100" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round"/>
  <!-- Char marks on chicken -->
  <line x1="140" y1="112" x2="155" y2="122" stroke="#431407" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="155" y1="112" x2="170" y2="122" stroke="#431407" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Birista / Crispy Fried Onion -->
  <path d="M 105 145 Q 115 140 125 148" stroke="#78350f" stroke-width="2" fill="none"/>
  <path d="M 180 150 Q 190 142 200 152" stroke="#78350f" stroke-width="2" fill="none"/>
  <!-- Fresh Mint & Coriander -->
  <circle cx="160" cy="115" r="4" fill="#15803d"/>
  <circle cx="165" cy="112" r="3.5" fill="#22c55e"/>
  <!-- Title Badge -->
  <rect x="75" y="15" width="170" height="28" rx="14" fill="#e11d48" opacity="0.95"/>
  <text x="160" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">CHICKEN BIRYANI</text>
</svg>
