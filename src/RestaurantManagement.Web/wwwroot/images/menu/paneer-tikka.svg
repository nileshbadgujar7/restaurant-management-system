<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="skewer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="paneer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="capsicum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="onion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)" rx="16"/>
  <!-- Plate -->
  <ellipse cx="160" cy="140" rx="130" ry="70" fill="#ffffff" filter="url(#shadow)"/>
  <ellipse cx="160" cy="140" rx="112" ry="58" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Skewer line -->
  <line x1="45" y1="165" x2="275" y2="100" stroke="url(#skewer)" stroke-width="4" stroke-linecap="round"/>
  <!-- Tikka Pieces -->
  <!-- Capsicum 1 -->
  <rect x="70" y="140" width="18" height="28" rx="5" fill="url(#capsicum)" transform="rotate(-15 79 154)"/>
  <!-- Paneer Cube 1 -->
  <rect x="92" y="125" width="34" height="34" rx="6" fill="url(#paneer)" transform="rotate(-15 109 142)" filter="url(#shadow)"/>
  <line x1="96" y1="135" x2="120" y2="130" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="145" x2="122" y2="140" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <!-- Onion 1 -->
  <rect x="130" y="125" width="16" height="26" rx="4" fill="url(#onion)" transform="rotate(-15 138 138)"/>
  <!-- Paneer Cube 2 -->
  <rect x="150" y="110" width="34" height="34" rx="6" fill="url(#paneer)" transform="rotate(-15 167 127)" filter="url(#shadow)"/>
  <line x1="154" y1="120" x2="178" y2="115" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="156" y1="130" x2="180" y2="125" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Capsicum 2 -->
  <rect x="188" y="110" width="18" height="28" rx="5" fill="url(#capsicum)" transform="rotate(-15 197 124)"/>
  <!-- Paneer Cube 3 -->
  <rect x="210" y="95" width="34" height="34" rx="6" fill="url(#paneer)" transform="rotate(-15 227 112)" filter="url(#shadow)"/>
  <line x1="214" y1="105" x2="238" y2="100" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <line x1="216" y1="115" x2="240" y2="110" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <!-- Garnish -->
  <circle cx="110" cy="140" r="3" fill="#15803d"/>
  <circle cx="170" cy="120" r="3" fill="#15803d"/>
  <circle cx="225" cy="110" r="3" fill="#15803d"/>
  <!-- Lemon wedge -->
  <path d="M 60 170 A 20 20 0 0 0 95 175 Z" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
  <!-- Title Badge -->
  <rect x="80" y="15" width="160" height="28" rx="14" fill="#ea580c" opacity="0.95"/>
  <text x="160" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">PANEER TIKKA</text>
</svg>

