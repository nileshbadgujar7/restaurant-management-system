<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="naan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="320" height="240" fill="url(#bg)" rx="16"/>
  <!-- Basket / Plate -->
  <ellipse cx="160" cy="145" rx="125" ry="65" fill="#78350f" opacity="0.3" filter="url(#shadow)"/>
  <ellipse cx="160" cy="142" rx="115" ry="55" fill="#fef9c3" stroke="#fef08a" stroke-width="2"/>
  <!-- Naan Tear-drop shape -->
  <path d="M 160 75 C 225 90, 250 145, 230 180 C 200 210, 110 205, 85 175 C 60 140, 95 90, 160 75 Z" fill="url(#naan)" filter="url(#shadow)"/>
  <!-- Tandoori Char Spots -->
  <ellipse cx="130" cy="120" rx="12" ry="7" fill="#78350f" opacity="0.75"/>
  <ellipse cx="185" cy="115" rx="14" ry="8" fill="#92400e" opacity="0.8"/>
  <ellipse cx="150" cy="155" rx="18" ry="10" fill="#78350f" opacity="0.7"/>
  <ellipse cx="205" cy="150" rx="10" ry="6" fill="#92400e" opacity="0.75"/>
  <ellipse cx="110" cy="160" rx="9" ry="5" fill="#78350f" opacity="0.8"/>
  <!-- Melted Butter Glaze -->
  <path d="M 140 130 Q 165 140 175 125 T 195 140" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- Nigella Seeds / Kalonji & Coriander -->
  <circle cx="125" cy="105" r="2" fill="#0f172a"/>
  <circle cx="145" cy="110" r="1.5" fill="#0f172a"/>
  <circle cx="170" cy="100" r="2" fill="#0f172a"/>
  <circle cx="160" cy="140" r="2" fill="#0f172a"/>
  <circle cx="180" cy="135" r="1.5" fill="#0f172a"/>
  <circle cx="135" cy="145" r="3" fill="#15803d"/>
  <circle cx="175" cy="155" r="3" fill="#15803d"/>
  <!-- Title Badge -->
  <rect x="80" y="15" width="160" height="28" rx="14" fill="#d97706" opacity="0.95"/>
  <text x="160" y="34" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">BUTTER NAAN</text>
</svg>

